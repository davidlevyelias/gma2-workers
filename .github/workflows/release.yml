name: Tag Release

on:
  push:
    tags:
      - "v*"

jobs:
  pack-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        run: test "${{ github.ref_name }}" = "v$(node -p "require('./package.json').version")"

      - name: Build package
        run: npm run pack

      - name: Name the bundle after the version
        id: artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="dist/gma2-workers_v${VERSION}.lua"
          cp dist/gma2-workers.lua "$FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.artifact.outputs.path }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
